apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-aws
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: qwen-project
  source:
    repoURL: https://github.com/your-org/your-repo
    targetRevision: main
    path: apps/bootstrap/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
