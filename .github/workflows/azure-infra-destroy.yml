name: Azure infra destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.35.0'

      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group sue-resource-group \
            --name qwen-cluster \
            --admin \
            --overwrite-existing

      - name: Delete Qwen InferenceService
        run: |
          kubectl delete -f apps/kserve/qwen.yaml --ignore-not-found

      - name: Delete KServe cluster resources
        run: |
          kubectl delete -f https://github.com/kserve/kserve/releases/download/v0.14.0/kserve-cluster-resources.yaml --ignore-not-found

      - name: Delete KServe
        run: |
          kubectl delete -f https://github.com/kserve/kserve/releases/download/v0.14.0/kserve.yaml --ignore-not-found

      - name: Delete Istio
        run: |
          curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.20.0 sh -
          export PATH=$PWD/istio-1.20.0/bin:$PATH
          istioctl uninstall --purge -y
          kubectl delete namespace istio-system --ignore-not-found

      - name: Delete cert-manager
        run: |
          kubectl delete -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml --ignore-not-found
          kubectl delete namespace cert-manager --ignore-not-found

  destroy-infra:
    runs-on: ubuntu-latest
    needs: destroy-model

    defaults:
      run:
        working-directory: infra/azure/

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_cluster_admins: ${{ secrets.TF_VAR_CLUSTER_ADMINS_AZURE }}
