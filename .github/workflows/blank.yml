name: Azure deploy infra and Qwen model inside AKS cluster

on:
  workflow_dispatch:
  push:
    branches:
      - feature/azure-terraform-infra

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/azure/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.35.0'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_cluster_admins: ${{ secrets.TF_VAR_CLUSTER_ADMINS_AZURE }}

      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group sue-resource-group \
            --name qwen-cluster \
            --admin \
            --overwrite-existing

  deploy-model:
    runs-on: ubuntu-latest
    needs: terraform-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.35.0'

      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group sue-resource-group \
            --name qwen-cluster \
            --admin \
            --overwrite-existing

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml

      - name: Wait for cert-manager
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=cert-manager \
            -n cert-manager \
            --timeout=120s
          kubectl wait --for=condition=ready pod \
            -l app=cainjector \
            -n cert-manager \
            --timeout=120s
          kubectl wait --for=condition=ready pod \
            -l app=webhook \
            -n cert-manager \
            --timeout=120s

      - name: Install Istio
        run: |
          curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.20.0 sh -
          export PATH=$PWD/istio-1.20.0/bin:$PATH
          istioctl install --set profile=default -y

      - name: Wait for Istio
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=istiod \
            -n istio-system \
            --timeout=180s
          kubectl wait --for=condition=ready pod \
            -l app=istio-ingressgateway \
            -n istio-system \
            --timeout=180s

      - name: Install KServe
        run: |
          kubectl apply --server-side --force-conflicts -f https://github.com/kserve/kserve/releases/download/v0.14.0/kserve.yaml

      - name: Wait for KServe
        run: |
          kubectl wait --for=condition=ready pod \
            -l control-plane=kserve-controller-manager \
            -n kserve \
            --timeout=300s

      - name: Install KServe cluster resources
        run: |
          kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.14.0/kserve-cluster-resources.yaml

      - name: Wait for KServe CRDs
        run: |
          kubectl wait --for=condition=established crd \
            inferenceservices.serving.kserve.io \
            --timeout=60s
          kubectl wait --for=condition=established crd \
            clusterservingruntimes.serving.kserve.io \
            --timeout=60s

      - name: Deploy Qwen model
        run: |
          kubectl apply -f apps/kserve/qwen.yaml

      - name: Wait for Qwen pod to start
        run: |
          kubectl wait --for=condition=ready pod \
            -l serving.kserve.io/inferenceservice=qwen \
            -n default \
            --timeout=600s

      # Azure AKS creates a LoadBalancer automatically via the Azure cloud provider.
      # KServe creates a NodePort service by default.
      # Patching to LoadBalancer triggers Azure to provision a public IP.
      - name: Expose Qwen via LoadBalancer
        run: |
          kubectl patch service qwen-predictor -n default \
            -p '{"spec": {"type": "LoadBalancer"}}'

      - name: Print Qwen endpoint
        run: |
          sleep 30
          IP=$(kubectl get service qwen-predictor -n default \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "http://$IP/openai/v1/chat/completions"
