name: AWS deploy infra

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/aws/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}
        
          #A check to see if the pipeline read the secrets
      - name: Verify cluster admins secret
        run: |
          echo "CLUSTER_ADMIN_DANIL length: ${#CLUSTER_ADMIN_DANIL}"
          echo "CLUSTER_ADMIN_CEJAY length: ${#CLUSTER_ADMIN_CEJAY}"
          echo "CLUSTER_ADMIN_NIGEL length: ${#CLUSTER_ADMIN_NIGEL}"
          echo "CLUSTER_ADMIN_RIK length: ${#CLUSTER_ADMIN_RIK}"
          echo "CLUSTER_ADMIN_ANDONIS length: ${#CLUSTER_ADMIN_ANDONIS}"
        env:
          CLUSTER_ADMIN_DANIL: ${{ secrets.CLUSTER_ADMIN_DANIL }}
          CLUSTER_ADMIN_CEJAY: ${{ secrets.CLUSTER_ADMIN_CEJAY }}
          CLUSTER_ADMIN_NIGEL: ${{ secrets.CLUSTER_ADMIN_NIGEL }}
          CLUSTER_ADMIN_RIK: ${{ secrets.CLUSTER_ADMIN_RIK }}
          CLUSTER_ADMIN_ANDONIS: ${{ secrets.CLUSTER_ADMIN_ANDONIS }}
  
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          cluster_admins: ${{secrets.cluster_admins}}
          
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name qwen-cluster
