name: AWS infra destroy
on:
  workflow_dispatch: 
permissions:
  id-token: write
  contents: read
jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name qwen-cluster

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Remove ConfigMap from state
        run: |
          terraform state rm kubernetes_config_map_v1_data.aws_auth || echo "ConfigMap not in state"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VARS_cluster_admins: ${{secrets.TF_VARS_cluster_admins}}